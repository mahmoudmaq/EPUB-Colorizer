[project]
name = "epub-colorizer"
version = "1.0.0"
description = "Colorize system markers and character names in EPUB books entirely on your device."
requires-python = ">=3.12"
authors = [
    { name = "mahmoudmaq", email = "elmaqhor2@gmail.com" }
]
dependencies = [
    "flet"
]

[dependency-groups]
dev = [
    "flet-cli",
    "flet-desktop",
    "flet-web"
]

[tool.flet.metadata]
title = "EPUB Colorizer"

[tool.flet]
org = "dev.flet"
company = "mahmoudmaq"
copyright = "Copyright (C) 2026 by mahmoudmaq"

[tool.flet.app]
path = "src"
