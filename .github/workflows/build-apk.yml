name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: 1
      FLET_CLI_NO_RICH_OUTPUT: 1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet and uv
        run: |
          pip install flet==0.28.3 uv

      - name: Build APK
        run: |
          flet build apk --no-rich-output --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: epub-colorizer-apk
          path: build/apk/*.apk
          if-no-files-found: error
